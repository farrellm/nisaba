services:
  postgres:
    image: postgres:18-alpine
    container_name: nisaba-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: nisaba
      POSTGRES_PASSWORD: nisaba
      POSTGRES_DB: nisaba
    ports:
      - "5432:5432"
    volumes:
      # Postgres 18+ layout: mount the parent dir; data lives in a versioned
      # subdirectory so a future major upgrade can run pg_upgrade --link.
      # (postgres_data holds the pre-18 cluster, kept as a backup.)
      - postgres18_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nisaba -d nisaba"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  postgres18_data:
